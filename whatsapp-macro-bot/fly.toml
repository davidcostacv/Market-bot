# fly launch --no-deploy   (then edit the app name below)
# fly volumes create macro_data --size 1
# fly secrets set WHATSAPP_TOKEN=... WHATSAPP_PHONE_NUMBER_ID=... WHATSAPP_APP_SECRET=... \
#                 WHATSAPP_VERIFY_TOKEN=... ANTHROPIC_API_KEY=... ALLOWED_NUMBERS=...
# fly deploy
app = "whatsapp-macro-bot"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/macros.db"
  DEFAULT_TIMEZONE = "Europe/Madrid"
  DAILY_SUMMARY_HOUR = "21"

[mounts]
  source = "macro_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # 24/7: never suspend the machine, or the nightly recap and the webhook
  # both go quiet.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
