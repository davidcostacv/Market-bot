name: Market Pulse scan

# The scan runs here, not in a Claude session. Scheduled Claude sessions can read
# the repo but have no git push access, so every scan they ran was discarded.
# Actions can push — its own commits are in this repo's history.

on:
  schedule:
    # Market-moving news does not respect market hours. Earnings land after the
    # close, export controls and M&A land whenever, Asia and Europe break
    # overnight, and buyouts are announced on Sundays. A 10/10 at 18:00 Friday
    # should not wait until Monday.
    #
    # Hourly on weekdays; every three hours at weekends, when only genuinely
    # unscheduled news happens. Story-level dedupe stops the same headline
    # alerting twice, and an exhausted quota skips quietly.
    - cron: '5 * * * 1-5'      # every hour, Mon-Fri
    - cron: '5 */3 * * 0,6'    # every 3 hours, Sat-Sun
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Scan and print, but do not commit or alert'
        type: boolean
        default: false

concurrency:
  group: market-pulse-scan
  cancel-in-progress: false

permissions:
  contents: write

env:
  DATA_BRANCH: claude/realtime-market-news-agent-w50nuu

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Anthropic SDK
        run: pip install --quiet --upgrade anthropic

      # Same guard as the bot workflow: without the key, skip quietly rather than
      # failing on every scheduled run and mailing a notice each time.
      # Accepts the key under any of the names people reasonably reach for, and
      # says which names are populated (by length — never a value) so a mismatch
      # is one log line rather than a guessing game.
      - name: Check a model API key is configured
        id: gate
        env:
          A: ${{ secrets.ANTHROPIC_API_KEY }}
          B: ${{ secrets.CLAUDE_API_KEY }}
          C: ${{ secrets.ANTHROPIC_KEY }}
          D: ${{ secrets.CLAUDE_KEY }}
          E: ${{ secrets.ANTHROPIC_TOKEN }}
          G: ${{ secrets.GEMINI_API_KEY }}
          H: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "secret names visible to this workflow (length only):"
          echo "  ANTHROPIC_API_KEY -> ${#A}"
          echo "  CLAUDE_API_KEY    -> ${#B}"
          echo "  ANTHROPIC_KEY     -> ${#C}"
          echo "  CLAUDE_KEY        -> ${#D}"
          echo "  ANTHROPIC_TOKEN   -> ${#E}"
          echo "  GEMINI_API_KEY    -> ${#G}"
          echo "  GOOGLE_API_KEY    -> ${#H}"
          KEY="${A:-${B:-${C:-${D:-${E:-}}}}}"
          GKEY="${G:-${H:-}}"
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
            echo "ANTHROPIC_API_KEY=$KEY" >> "$GITHUB_ENV"
            echo "found an Anthropic key (${#KEY} chars)"
          fi
          if [ -n "$GKEY" ]; then
            echo "::add-mask::$GKEY"
            echo "GEMINI_API_KEY=$GKEY" >> "$GITHUB_ENV"
            echo "found a Gemini key (${#GKEY} chars)"
          fi
          if [ -z "$KEY" ] && [ -z "$GKEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No model API key found. Add GEMINI_API_KEY (free at aistudio.google.com/apikey) or an Anthropic key under Settings > Secrets and variables > Actions."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan the wires and score
        if: steps.gate.outputs.ready == 'true'
        env:
          # An identifier, not a credential — it is useless without the API key,
          # and it appears in the console URL. Inlined so the scan works without
          # a fourth secret; a secret of the same name still overrides it.
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID || 'wrkspc_015aj4TLt7DTweVzLPSUynaL' }}
          CLAUDE_WORKSPACE_ID: ${{ secrets.CLAUDE_WORKSPACE_ID }}
        run: python3 market-pulse/scan.py

      - name: Rebuild the dashboard
        if: steps.gate.outputs.ready == 'true'
        run: python3 market-pulse/build.py

      - name: Push alert-grade items to Telegram
        if: steps.gate.outputs.ready == 'true' && !inputs.dry_run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
        run: python3 market-pulse/telegram/bot.py alerts

      - name: Commit the scan
        if: steps.gate.outputs.ready == 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          if git diff --quiet -- market-pulse/; then
            echo "nothing new this scan"; exit 0
          fi
          git config user.name  "market-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-pulse/
          git commit -m "scan: $(date -u '+%Y-%m-%d %H:%M')Z [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:"$DATA_BRANCH"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git fetch origin "$DATA_BRANCH"
            git rebase "origin/$DATA_BRANCH" || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          echo "could not push after 5 attempts" >&2
          exit 1
